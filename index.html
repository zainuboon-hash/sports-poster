<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>സബ്ജില്ലാ കായികമേള 🏆</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #eef2f6;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }
    h2 { color: #d32f2f; margin-top: 0; font-size: 20px; font-weight: 700; }
    p { color: #555; font-size: 13px; margin-bottom: 14px; }
    .form-group { text-align: left; margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #333; }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-create { background: #d32f2f; color: white; }
    .btn-download { background: #007bff; color: white; margin-top: 14px; }
    .btn-wa { background: #25D366; color: white; text-decoration: none; display: block; padding: 13px; border-radius: 8px; font-weight: 600; margin-top: 10px; }
    
    #editorArea { display: none; margin-top: 12px; }
    .canvas-box {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      touch-action: none;
      cursor: move;
    }
    .controls { background: #f8fafc; padding: 12px; border-radius: 10px; margin-top: 10px; border: 1px solid #e2e8f0; }
    .controls label { font-size: 13px; color: #475569; font-weight: 600; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
    .slider-row input[type="range"] { flex: 1; accent-color: #d32f2f; height: 6px; }
    
    .move-pad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }
    .pad-row { display: flex; gap: 8px; }
    .pad-btn {
      background: #e2e8f0;
      color: #1e293b;
      font-size: 15px;
      padding: 9px 18px;
      width: auto;
      margin: 0;
      border-radius: 6px;
      font-weight: bold;
    }
    .pad-btn:active { background: #cbd5e1; }
    .pad-reset { background: #fee2e2; font-size: 12px; padding: 6px 12px; color: #dc2626; }
    .hint { font-size: 12px; color: #0284c7; margin-top: 8px; font-weight: 500; }
  </style>
</head>
<body>

<div class="card">
  <h2>സബ്ജില്ലാ കായികമേള 🏆</h2>
  <p>നിങ്ങളുടെ പേരും ഫോട്ടോയും ചേർത്ത് ആശംസാ പോസ്റ്റർ തയ്യാറാക്കൂ</p>

  <div id="inputForm">
    <div class="form-group">
      <label>നിങ്ങളുടെ പേര്</label>
      <input type="text" id="userName" placeholder="പേര് ടൈപ്പ് ചെയ്യുക">
    </div>

    <div class="form-group">
      <label>നിങ്ങളുടെ ഫോട്ടോ</label>
      <input type="file" id="userPhoto" accept="image/*">
    </div>

    <button class="btn-create" onclick="startEditing()">പോസ്റ്റർ തയ്യാറാക്കൂ 🚀</button>
  </div>

  <div id="editorArea">
    <div class="canvas-box">
      <canvas id="posterCanvas"></canvas>
    </div>

    <div class="controls">
      <label>ഫോട്ടോ വലുപ്പം (Zoom / Resize)</label>
      <div class="slider-row">
        <span>🔍</span>
        <input type="range" id="zoomSlider" min="0.5" max="3" step="0.05" value="1" oninput="onZoomChange(this.value)">
      </div>

      <div style="margin-top: 10px;"><label>ഫോട്ടോ സ്ഥാനത്തേക്ക് മാറ്റുക (Move Photo)</label></div>
      <div class="move-pad">
        <button class="pad-btn" onclick="movePhoto(0, -15)">⬆️ മുകളിലേക്ക്</button>
        <div class="pad-row">
          <button class="pad-btn" onclick="movePhoto(-15, 0)">⬅️ ഇടത്തോട്ട്</button>
          <button class="pad-btn pad-reset" onclick="resetPosition()">റീസെറ്റ്</button>
          <button class="pad-btn" onclick="movePhoto(15, 0)">വലത്തോട്ട് ➡️</button>
        </div>
        <button class="pad-btn" onclick="movePhoto(0, 15)">⬇️ താഴേക്ക്</button>
      </div>

      <div class="hint">💡 ഫോട്ടോയിൽ വിരൽ വെച്ച് വലിച്ചോ മുകളിലെ ആരോ ബട്ടൺ വഴിയോ നീക്കാം</div>
    </div>

    <button class="btn-download" onclick="downloadPoster()">പോസ്റ്റർ ഡൗൺലോഡ് ചെയ്യുക 📥</button>
    <a id="waShareBtn" class="btn-wa" href="#" target="_blank">WhatsApp വഴി ഷെയർ ചെയ്യുക 💬</a>
  </div>
</div>

<script>
  let templateImg = new Image();
  let userImg = new Image();
  let templateLoaded = false;
  let userImgLoaded = false;

  let zoom = 1.0;
  let offsetX = 0;
  let offsetY = 0;
  let isDragging = false;
  let startX = 0;
  let startY = 0;

  templateImg.src = "poster.jpg";
  templateImg.onload = function() {
    templateLoaded = true;
  };

  function startEditing() {
    const name = document.getElementById('userName').value.trim();
    const fileInput = document.getElementById('userPhoto').files[0];

    if (!name) {
      alert("ദയവായി നിങ്ങളുടെ പേര് നൽകുക!");
      return;
    }
    if (!fileInput) {
      alert("ദയവായി ഒരു ഫോട്ടോ തിരഞ്ഞെടുക്കുക!");
      return;
    }
    if (!templateLoaded) {
      alert("പോസ്റ്റർ ലോഡ് ആയിക്കൊണ്ടിരിക്കുകയാണ്. അല്പം കഴിഞ്ഞ് വീണ്ടും ശ്രമിക്കുക.");
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      userImg = new Image();
      userImg.onload = function() {
        userImgLoaded = true;
        zoom = 1.0;
        offsetX = 0;
        offsetY = 0;
        document.getElementById('zoomSlider').value = 1.0;

        document.getElementById('inputForm').style.display = 'none';
        document.getElementById('editorArea').style.display = 'block';

        renderCanvas();
        setupDragEvents();
      };
      userImg.src = e.target.result;
    };
    reader.readAsDataURL(fileInput);
  }

  function renderCanvas() {
    if (!templateLoaded || !userImgLoaded) return;

    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    const W = templateImg.naturalWidth || 576;
    const H = templateImg.naturalHeight || 1024;
    canvas.width = W;
    canvas.height = H;

    // 1. ഒറിജിനൽ ബാക്ക്ഗ്രൗണ്ട് പോസ്റ്റർ
    ctx.drawImage(templateImg, 0, 0, W, H);

    // 2. സ്വർണ്ണ വളയത്തിന്റെ കൃത്യമായ സ്ഥാനം
    const circleCenterX = W * 0.280; 
    const circleCenterY = H * 0.265; 
    const circleRadius  = W * 0.220; 

    ctx.save();
    ctx.beginPath();
    ctx.arc(circleCenterX, circleCenterY, circleRadius, 0, Math.PI * 2, true);
    ctx.closePath();
    ctx.clip();

    const minDim = Math.min(userImg.width, userImg.height);
    const drawSize = (circleRadius * 2) * zoom;
    const drawX = (circleCenterX - (drawSize / 2)) + offsetX;
    const drawY = (circleCenterY - (drawSize / 2)) + offsetY;

    const sx = (userImg.width - minDim) / 2;
    const sy = (userImg.height - minDim) / 2;

    ctx.drawImage(userImg, sx, sy, minDim, minDim, drawX, drawY, drawSize, drawSize);
    ctx.restore();

    // 3. പേര് താഴെ സ്ട്രിപ്പിൽ ഓട്ടോ ഫിറ്റ്
    const name = document.getElementById('userName').value.trim();
    const fullText = ": " + name;
    const textStartX = W * 0.36; 
    const maxTextWidth = W * 0.60; 

    let fontSize = Math.round(W * 0.050);
    ctx.font = `bold ${fontSize}px sans-serif`;

    while (ctx.measureText(fullText).width > maxTextWidth && fontSize > 16) {
      fontSize -= 1;
      ctx.font = `bold ${fontSize}px sans-serif`;
    }

    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "left";
    ctx.fillText(fullText, textStartX, H * 0.965);

    const shareUrl = window.location.href;
    const shareText = encodeURIComponent(`ഞാനും സബ്ജില്ലാ കായികമേളയെ പിന്തുണയ്ക്കുന്നു! നിങ്ങളും പോസ്റ്റർ നിർമ്മിക്കൂ: ${shareUrl}`);
    document.getElementById('waShareBtn').href = `https://api.whatsapp.com/send?text=${shareText}`;
  }

  function onZoomChange(val) {
    zoom = parseFloat(val);
    renderCanvas();
  }

  function movePhoto(dx, dy) {
    offsetX += dx;
    offsetY += dy;
    renderCanvas();
  }

  function resetPosition() {
    offsetX = 0;
    offsetY = 0;
    zoom = 1.0;
    document.getElementById('zoomSlider').value = 1.0;
    renderCanvas();
  }

  function setupDragEvents() {
    const canvas = document.getElementById('posterCanvas');

    canvas.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', function(e) {
      if (!isDragging || e.touches.length !== 1) return;
      e.preventDefault();

      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;

      const scale = canvas.width / canvas.clientWidth;
      offsetX += dx * scale;
      offsetY += dy * scale;
      renderCanvas();
    }, { passive: false });

    canvas.addEventListener('touchend', function() { isDragging = false; });
    canvas.addEventListener('touchcancel', function() { isDragging = false; });

    canvas.addEventListener('mousedown', function(e) {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      startX = e.clientX;
      startY = e.clientY;

      const scale = canvas.width / canvas.clientWidth;
      offsetX += dx * scale;
      offsetY += dy * scale;
      renderCanvas();
    });

    window.addEventListener('mouseup', function() { isDragging = false; });
  }

  function downloadPoster() {
    const canvas = document.getElementById('posterCanvas');
    const link = document.createElement('a');
    link.download = 'sports_poster.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>

</body>
</html>
