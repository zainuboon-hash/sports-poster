<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>സബ്ജില്ലാ കായികമേള 🏆</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #eef2f6;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }
    h2 { color: #d32f2f; margin-top: 0; font-size: 20px; font-weight: 700; }
    p { color: #555; font-size: 13px; margin-bottom: 16px; }
    .form-group { text-align: left; margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #333; }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-create { background: #d32f2f; color: white; }
    .btn-download { background: #007bff; color: white; margin-top: 15px; }
    .btn-wa { background: #25D366; color: white; text-decoration: none; display: block; padding: 13px; border-radius: 8px; font-weight: 600; margin-top: 10px; }
    
    #editorArea { display: none; margin-top: 15px; }
    .canvas-box { position: relative; width: 100%; overflow: hidden; border-radius: 12px; touch-action: none; }
    canvas { width: 100%; height: auto; display: block; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); cursor: move; }
    .controls { background: #f8fafc; padding: 12px; border-radius: 10px; margin-top: 10px; border: 1px solid #e2e8f0; }
    .controls label { font-size: 13px; color: #475569; font-weight: 600; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
    .slider-row input[type="range"] { flex: 1; accent-color: #d32f2f; height: 6px; }
    .hint { font-size: 12px; color: #0284c7; margin-top: 6px; font-weight: 500; }
  </style>
</head>
<body>

<div class="card">
  <h2>സബ്ജില്ലാ കായികമേള 🏆</h2>
  <p>നിങ്ങളുടെ പേരും ഫോട്ടോയും ചേർത്ത് ആശംസാ പോസ്റ്റർ തയ്യാറാക്കൂ</p>

  <div id="inputForm">
    <div class="form-group">
      <label>നിങ്ങളുടെ പേര്</label>
      <input type="text" id="userName" placeholder="പേര് ടൈപ്പ് ചെയ്യുക">
    </div>

    <div class="form-group">
      <label>നിങ്ങളുടെ ഫോട്ടോ</label>
      <input type="file" id="userPhoto" accept="image/*">
    </div>

    <button class="btn-create" onclick="startEditing()">പോസ്റ്റർ തയ്യാറാക്കൂ 🚀</button>
  </div>

  <div id="editorArea">
    <div class="canvas-box">
      <canvas id="posterCanvas"></canvas>
    </div>

    <div class="controls">
      <label>ഫോട്ടോ വലുപ്പം (Zoom / Resize)</label>
      <div class="slider-row">
        <span>🔍</span>
        <input type="range" id="zoomSlider" min="0.5" max="3" step="0.05" value="1" oninput="onZoomChange(this.value)">
      </div>
      <div class="hint">💡 ഫോട്ടോയിൽ തൊട്ട് വിരൽ കൊണ്ട് ഇഷ്ടമുള്ള സ്ഥാനത്തേക്ക് നീക്കി വെക്കാം (Drag to adjust)</div>
    </div>

    <button class="btn-download" onclick="downloadPoster()">പോസ്റ്റർ ഡൗൺലോഡ് ചെയ്യുക 📥</button>
    <a id="waShareBtn" class="btn-wa" href="#" target="_blank">WhatsApp വഴി ഷെയർ ചെയ്യുക 💬</a>
  </div>
</div>

<script>
  let templateImg = new Image();
  let userImg = new Image();
  let templateLoaded = false;
  let userImgLoaded = false;

  let zoom = 1.0;
  let offsetX = 0;
  let offsetY = 0;
  let isDragging = false;
  let startX = 0;
  let startY = 0;

  templateImg.src = "poster.jpg";
  templateImg.onload = function() {
    templateLoaded = true;
  };

  function startEditing() {
    const name = document.getElementById('userName').value.trim();
    const fileInput = document.getElementById('userPhoto').files[0];

    if (!name) {
      alert("ദയവായി നിങ്ങളുടെ പേര് നൽകുക!");
      return;
    }
    if (!fileInput) {
      alert("ദയവായി ഒരു ഫോട്ടോ തിരഞ്ഞെടുക്കുക!");
      return;
    }
    if (!templateLoaded) {
      alert("പോസ്റ്റർ ലോഡ് ആയിക്കൊണ്ടിരിക്കുകയാണ്. അല്പം കഴിഞ്ഞ് വീണ്ടും ശ്രമിക്കുക.");
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      userImg = new Image();
      userImg.onload = function() {
        userImgLoaded = true;
        zoom = 1.0;
        offsetX = 0;
        offsetY = 0;
        document.getElementById('zoomSlider').value = 1.0;

        document.getElementById('inputForm').style.display = 'none';
        document.getElementById('editorArea').style.display = 'block';

        renderCanvas();
        setupDragEvents();
      };
      userImg.src = e.target.result;
    };
    reader.readAsDataURL(fileInput);
  }

  function renderCanvas() {
    if (!templateLoaded || !userImgLoaded) return;

    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    const W = templateImg.naturalWidth || 576;
    const H = templateImg.naturalHeight || 1024;
    canvas.width = W;
    canvas.height = H;

    // 1. ഒറിജിനൽ പോസ്റ്റർ ബാക്ക്ഗ്രൗണ്ട് വരയ്ക്കുന്നു
    ctx.drawImage(templateImg, 0, 0, W, H);

    // 2. സ്വർണ്ണ വട്ടത്തിന്റെ ശരിയായ സ്ഥാനവും വലിപ്പവും
    const circleCenterX = W * 0.355; 
    const circleCenterY = H * 0.540; 
    const circleRadius  = W * 0.220; 

    // ✅ പെർഫെക്റ്റ് സർക്കിൾ ക്ലിപ്പിംഗ് (ഫോട്ടോ ഇതിന് പുറത്തേക്ക് കടക്കില്ല)
    ctx.save();
    ctx.beginPath();
    ctx.arc(circleCenterX, circleCenterY, circleRadius, 0, Math.PI * 2, true);
    ctx.closePath();
    ctx.clip(); // ഇതിലൂടെ ഫോട്ടോ വട്ടത്തിനുള്ളിൽ മാത്രം ഒതുങ്ങും

    // ഡ്രാഗ് & സൂം അനുസരിച്ച് ഫോട്ടോ വരയ്ക്കുന്നു
    const minDim = Math.min(userImg.width, userImg.height);
    const drawSize = (circleRadius * 2) * zoom;
    const drawX = (circleCenterX - (drawSize / 2)) + offsetX;
    const drawY = (circleCenterY - (drawSize / 2)) + offsetY;

    const sx = (userImg.width - minDim) / 2;
    const sy = (userImg.height - minDim) / 2;

    ctx.drawImage(userImg, sx, sy, minDim, minDim, drawX, drawY, drawSize, drawSize);
    ctx.restore(); // ക്ലിപ്പ് റദ്ദാക്കുന്നു

    // 3. പേര് ഇടത്തുനിന്ന് തുടങ്ങി ഓട്ടോമാറ്റിക് ആയി വലിപ്പം കുറച്ച് ഫിറ്റ് ചെയ്യുന്നു
    const name = document.getElementById('userName').value.trim();
    const fullText = ": " + name;
    const textStartX = W * 0.38; // കൂടുതൽ ഇടത്തോട്ട് മാറ്റി
    const maxTextWidth = W * 0.58; // പരമാവധി സ്പേസ്

    let fontSize = Math.round(W * 0.050);
    ctx.font = `bold ${fontSize}px sans-serif`;

    // വലിയ പേരാണെങ്കിൽ അക്ഷരങ്ങൾ തനിയെ ചെറുതാകുന്നു
    while (ctx.measureText(fullText).width > maxTextWidth && fontSize > 16) {
      fontSize -= 1;
      ctx.font = `bold ${fontSize}px sans-serif`;
    }

    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "left";
    ctx.fillText(fullText, textStartX, H * 0.965);

    // WhatsApp ഷെയർ ലിങ്ക്
    const shareUrl = window.location.href;
    const shareText = encodeURIComponent(`ഞാനും സബ്ജില്ലാ കായികമേളയെ പിന്തുണയ്ക്കുന്നു! നിങ്ങളും പോസ്റ്റർ നിർമ്മിക്കൂ: ${shareUrl}`);
    document.getElementById('waShareBtn').href = `https://api.whatsapp.com/send?text=${shareText}`;
  }

  function onZoomChange(val) {
    zoom = parseFloat(val);
    renderCanvas();
  }

  function setupDragEvents() {
    const canvas = document.getElementById('posterCanvas');

    canvas.ontouchstart = function(e) {
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    };
    canvas.ontouchmove = function(e) {
      if (!isDragging) return;
      e.preventDefault();
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;

      const scale = canvas.width / canvas.clientWidth;
      offsetX += dx * scale;
      offsetY += dy * scale;
      renderCanvas();
    };
    canvas.ontouchend = function() { isDragging = false; };

    canvas.onmousedown = function(e) {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    };
    window.onmousemove = function(e) {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      startX = e.clientX;
      startY = e.clientY;

      const scale = canvas.width / canvas.clientWidth;
      offsetX += dx * scale;
      offsetY += dy * scale;
      renderCanvas();
    };
    window.onmouseup = function() { isDragging = false; };
  }

  function downloadPoster() {
    const canvas = document.getElementById('posterCanvas');
    const link = document.createElement('a');
    link.download = 'sports_poster.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>

</body>
</html>
